[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "property-manager-tui"
version = "0.1.0"
description = "Local-first property manager with Textual TUI and FastAPI/HTMX web UI (shared core, SQLite-safe single-worker web)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Michael Helmy" }]
keywords = ["property", "hotel", "pms", "pos", "inventory", "tui", "fastapi", "htmx", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Office/Business",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "textual>=0.47",
]

[project.urls]
Homepage = "https://github.com/Michaelhehelmy/property-manager-tui"
Repository = "https://github.com/Michaelhehelmy/property-manager-tui"
Issues = "https://github.com/Michaelhehelmy/property-manager-tui/issues"

[project.optional-dependencies]
# Web UI (FastAPI/HTMX). Always run server with --workers 1 (SQLite).
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
]
# Optional local intent-routing ML (sklearn/SetFit). Install only if you train/use ML NLU.
assistant-ml = [
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "setfit>=1.0",
  "sentence-transformers>=2.2",
]
# Optional local "talking" LLM runtime (GGUF via llama.cpp). Model files are not bundled.
assistant-llm = [
  "llama-cpp-python>=0.2",
]
# Development and test tools.
dev = [
  "pytest>=7.0",
  "httpx>=0.24",
  "pytest-cov>=4.0",
  "ruff>=0.8.0",
]
# Label/barcode printing uses configured system/default printers (and text/PDF exports);
# no extra Python deps required by default.
labels = []
# Convenience extra to install common web + dev tooling
all = [
  "property-manager-tui[web,dev]",
]

[project.scripts]
property-manager = "launcher:main"
property-manager-tui = "main:main"
pm = "launcher:main"
pm-tui = "main:main"

[tool.setuptools]
include-package-data = true
py-modules = ["main", "launcher"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["app_core*", "ui*"]
exclude = ["tests*", "scripts*", "docs*", "data*", "models*", "deploy*", "**/__pycache__"]

[tool.setuptools.package-dir]
"" = "src"
"ui" = "ui"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  ".git",
  "__pycache__",
  "data",
  "models",
  ".pytest_cache",
]

[tool.ruff.lint]
# Dead-code and quality gates (pragmatic, targeted baseline).
# E9: syntax/runtime errors; F401/F841: unused imports/vars (dead code);
# F82x/F821: undefined names/unused/unpacked issues.
select = ["E9", "F401", "F841", "F821", "F822", "F823"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Package surfaces, tests, and scripts may contain intentional imports/fixtures/helpers.
"__init__.py" = ["F401", "F403"]
"tests/**" = ["F401", "F841"]
"scripts/**" = ["F401", "F841"]
"ui/**" = ["F401", "F841"]