{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spms.secretName" . }}
  labels:
    {{- include "spms.labels" . | nindent 4 }}
type: Opaque
stringData:
  PM_WEB_SECRET_KEY: {{ .Values.secret.webSecretKey | default (randAlphaNum 48) | quote }}
{{- end -}}