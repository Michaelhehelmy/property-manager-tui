extends: default

ignore: |
  deploy/helm/spms/templates/
  .venv/
  venv/
  dist/
  htmlcov/

rules:
  document-start: disable
  line-length:
    max: 160
    level: warning
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: consistent
  empty-lines:
    max: 2
