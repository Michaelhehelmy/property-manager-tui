<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or brand_name }} — Web UI</title>
  <link rel="stylesheet" href="/static/app.css"/>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<div class="layout">
  <nav>
    <h1>{{ brand_name }}</h1>
    <div class="gift">★ {{ gift }}</div>
    <a href="/" title="Overview: occupancy, arrivals, departures, in-house and key ledger stats">Dashboard</a>
    <a href="/reservations" title="Create and manage reservations: check-in/out, modify, cancel/no-show, folio, payments, invoices, book activities">Reservations</a>
    <a href="/guests" title="Guest portfolio index and 360° profiles: all stays, POS/orders, payments, invoices, totals">Guests</a>
    <a href="/pos" title="POS & Inventory: charge items to reservations, walk-in cart, inventory/meals/recipes, register activities/trips">POS / Inventory</a>
    <a href="/accounting" title="Accounting & expenses: record/void expenses, view ledger-related entries">Accounting</a>
    <a href="/reports" title="Reports & analytics: P&L, cash flow, VAT, payments, occupancy, daily ops, comparisons">Reports & Analytics</a>
    <a href="/assistant" title="AI manager assistant: ask questions in plain English, get grounded answers from real app data">Manager Assistant</a>
    <a href="/settings" title="Settings, branding, seed config export/import, demo data presets, rooms, rate plans, backups and health">Settings / Branding</a>
    <hr style="border-color:#45475a"/>
    {% if unlocked %}
    <form method="post" action="/lock" class="inline" title="Lock protected actions (super-password actions will require unlock again)"><input type="hidden" name="csrf" value="{{ csrf_token }}"/><button class="warn" type="submit" title="Lock protected actions">Lock</button></form>
    {% else %}
    <a href="/unlock" title="Unlock to perform protected actions (settings, refunds/voids, seed apply, etc.)">Unlock (protected actions)</a>
    {% endif %}
  </nav>
  <main>
    {% for f in flashes %}<div class="flash {{ f.level }}">{{ f.message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
