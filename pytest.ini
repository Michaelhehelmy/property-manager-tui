[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    authz: authorization, CSRF, session/unlock, and rate-limiting security checks
    invariant: money/ledger/stock-batch invariants, migrations, and confinement contracts
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning
