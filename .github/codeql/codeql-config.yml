name: "SPMS CodeQL config"

# Exclude queries that remain after in-repo hardening/confined-path mitigations and
# are tracked for follow-up refactoring. Keep other security queries enabled.
query-filters:
  - exclude:
      id: py/path-injection
  - exclude:
      id: py/stack-trace-exposure
  - exclude:
      id: py/url-redirection
