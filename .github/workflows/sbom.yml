name: SBOM

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types:
      - published
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate repository SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom-repository.spdx.json

      - name: Generate repository SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-repository.cdx.json

      - name: Build container image for SBOM
        run: docker build --tag spms-sbom:${{ github.sha }} .

      - name: Generate image SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: spms-sbom:${{ github.sha }}
          format: spdx-json
          output-file: sbom-image.spdx.json

      - name: Generate image SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: spms-sbom:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.run_id }}
          path: |
            sbom-repository.spdx.json
            sbom-repository.cdx.json
            sbom-image.spdx.json
            sbom-image.cdx.json
          if-no-files-found: error

  attach-release:
    name: Attach SBOMs to release
    needs: generate
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ github.run_id }}
          path: sbom

      - name: Attach SBOMs to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            sbom/sbom-repository.spdx.json
            sbom/sbom-repository.cdx.json
            sbom/sbom-image.spdx.json
            sbom/sbom-image.cdx.json
