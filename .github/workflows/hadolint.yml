name: Hadolint

on:
  push:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
