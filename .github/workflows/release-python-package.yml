name: Build Python package (sdist/wheel)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --require-hashes -r requirements/ci-bootstrap-tools.txt
          python -m pip install --require-hashes -r requirements/ci-release-build.txt

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spms-python-package
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spms
    permissions:
      contents: read
      id-token: write  # Required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spms-python-package
          path: dist

      - name: Publish to PyPI (Trusted Publishing or API token)
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
        # Trusted Publishing (recommended): configure PyPI trusted publisher for this repo/workflow/environment.
        # API token fallback: add repository secret PYPI_API_TOKEN.
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
