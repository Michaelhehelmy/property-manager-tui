name: Build Python package (sdist/wheel)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --require-hashes -r requirements/ci-bootstrap-tools.txt
          python -m pip install --require-hashes -r requirements/ci-release-build.txt

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spms-python-package
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spms
    permissions:
      contents: read
      id-token: write  # Required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spms-python-package
          path: dist

      - name: Publish to PyPI (Trusted Publishing or API token)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        # Trusted Publishing (recommended): configure PyPI trusted publisher for this repo/workflow/environment.
        # API token fallback: add repository secret PYPI_API_TOKEN.
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
