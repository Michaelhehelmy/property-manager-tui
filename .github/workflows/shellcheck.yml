name: ShellCheck

on:
  push:
    paths:
      - 'scripts/**/*.sh'
  pull_request:
    paths:
      - 'scripts/**/*.sh'
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './scripts'
          severity: warning
          format: gcc
