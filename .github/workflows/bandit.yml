name: Bandit

on:
  push:
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/bandit.yml"
  pull_request:
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/bandit.yml"
  schedule:
    - cron: "0 8 * * 1" # Weekly (Mon 08:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bandit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --require-hashes -r requirements/ci-bootstrap-tools.txt
          python -m pip install --require-hashes -r requirements/ci-bandit.txt

      - name: Run Bandit (src + scripts)
        run: |
          bandit -r src scripts -ll -ii
