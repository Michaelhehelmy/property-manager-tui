name: Bandit

on:
  push:
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/bandit.yml"
  pull_request:
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/bandit.yml"
  schedule:
    - cron: "0 8 * * 1" # Weekly (Mon 08:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bandit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade "pip>=24.3.1"
          python -m pip install "bandit==1.9.4"

      - name: Run Bandit (src + scripts)
        run: |
          bandit -r src scripts -ll -ii
