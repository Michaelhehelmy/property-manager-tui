name: Bandit

on:
  push:
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/bandit.yml"
  pull_request:
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/bandit.yml"
  schedule:
    - cron: "0 8 * * 1" # Weekly (Mon 08:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bandit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Run Bandit (src + scripts)
        run: |
          bandit -r src scripts -ll -ii
