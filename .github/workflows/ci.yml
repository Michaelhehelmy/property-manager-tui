name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci-bootstrap-tools.txt
          case "${{ matrix.python-version }}" in
            3.10) python -m pip install --require-hashes -r requirements/runtime-linux-cp310.txt -r requirements/dev-linux-cp310.txt ;;
            3.11) python -m pip install --require-hashes -r requirements/runtime-linux-cp311.txt -r requirements/dev-linux-cp311.txt ;;
            3.12) python -m pip install --require-hashes -r requirements/runtime-linux-cp312.txt -r requirements/dev-linux-cp312.txt ;;
            *) echo "Unsupported Python version for hash-pinned CI deps: ${{ matrix.python-version }}" >&2; exit 1 ;;
          esac

      - name: Basic syntax check
        run: |
          python -m py_compile launcher.py main.py
          PYTHONPATH=src python -m compileall -q src ui tests

      - name: Lint / dead-code quality gates (ruff)
        env:
          PYTHONPATH: src
        run: |
          echo "::group::Ruff lint checks"
          python -m ruff check .
          echo "::endgroup::"

      - name: Run authz/invariant go-live checks (explicit)
        env:
          PM_WEB_SECRET_KEY: test-secret
          PYTHONPATH: src
        run: |
          echo "::group::AuthZ and invariant checks"
          python -m pytest tests -q --maxfail=20 --randomly-seed=1337 -m "authz or invariant"
          echo "::endgroup::"

      - name: Run full test suite
        env:
          PM_WEB_SECRET_KEY: test-secret
          PYTHONPATH: src
        run: |
          echo "::group::Full test suite"
          python -m pytest tests -q --maxfail=20 --randomly-seed=1337
          echo "::endgroup::"

      - name: Generate coverage report (enforced on 3.12)
        if: matrix.python-version == '3.12'
        env:
          PM_WEB_SECRET_KEY: test-secret
          PYTHONPATH: src
        run: |
          python -m pip install --require-hashes -r requirements/ci-pytest-cov.txt
          python -m pytest tests -q --maxfail=20 --randomly-seed=1337 --cov=src/app_core --cov=ui --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=95

      - name: Upload coverage artifacts
        if: matrix.python-version == '3.12' && always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            coverage.xml
          if-no-files-found: ignore

  typecheck:
    name: Type check (pyright, non-blocking baseline)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci-bootstrap-tools.txt
          python -m pip install --require-hashes -r requirements/runtime-linux-cp312.txt -r requirements/dev-linux-cp312.txt
          python -m pip install --require-hashes \
            --hash=sha256:2a6b4b3298c9eec174c5ed83bd338de6eee82df2992f3e1930e6199d381be36f \
            pyright==1.1.414

      - name: Run pyright
        run: |
          echo "::group::Pyright (baseline)"
          python -m pyright
          echo "::endgroup::"

  report-failure:
    name: Report failure issue (sanitized, deduplicated)
    needs: [test]
    if: ${{ failure() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          title="[CI] Failure: ${WORKFLOW} on ${REF_NAME}"
          label="ci-failure:auto"
          run_url="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          short_sha="${SHA:0:12}"
          body_file="$(mktemp)"
          {
            echo "Automated CI failure report (sanitized)."
            echo ""
            echo "- Workflow: ${WORKFLOW}"
            echo "- Event: ${EVENT}"
            echo "- Ref: ${REF_NAME}"
            echo "- Commit: ${short_sha}"
            echo "- Run: [#${RUN_NUMBER} (attempt ${RUN_ATTEMPT})](${run_url})"
            echo ""
            echo "This issue was opened/updated automatically because a CI run failed. Review the run logs in GitHub Actions, fix the cause, and close this issue when resolved. No secrets, environment variables, logs, or runtime data are included."
          } >"$body_file"
          # Dedupe by exact open issue title with automation label.
          # shellcheck disable=SC2016
          existing="$(gh issue list --repo "$REPO" --state open --label "$label" --search "$title in:title" --json number,title --jq --arg t "$title" '.[] | select(.title==$t) | .number' 2>/dev/null | head -n1 || true)"
          if [ -n "${existing}" ] && [ "${existing}" != "null" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file "$body_file" >/dev/null
            echo "Updated existing issue #${existing}"
          else
            gh label create "$label" --repo "$REPO" --color "B60205" --description "Automated CI failure reports" >/dev/null 2>&1 || true
            gh issue create --repo "$REPO" --title "$title" --label "$label" --body-file "$body_file"
          fi
