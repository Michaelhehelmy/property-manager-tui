name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          # Install web deps for web-helper/deps and web integration tests (FastAPI/TestClient)
          if [ -f requirements-web.txt ]; then python -m pip install -r requirements-web.txt; fi
          python -m pip install -e .

      - name: Basic syntax check
        run: |
          python -m py_compile launcher.py main.py
          PYTHONPATH=src python -m compileall -q src ui tests

      - name: Run authz/invariant go-live checks (explicit)
        env:
          PM_WEB_SECRET_KEY: test-secret
          PYTHONPATH: src
        run: |
          echo "::group::AuthZ and invariant checks"
          python -m pytest tests -q --maxfail=20 -m "authz or invariant"
          echo "::endgroup::"

      - name: Run full test suite
        env:
          PM_WEB_SECRET_KEY: test-secret
          PYTHONPATH: src
        run: |
          echo "::group::Full test suite"
          python -m pytest tests -q --maxfail=20
          echo "::endgroup::"
