name: YAML Lint

on:
  push:
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '.github/**'
  pull_request:
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '.github/**'

permissions:
  contents: read

jobs:
  yamllint:
    name: Lint YAML files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
          file_or_dir: .
          strict: false
          no_warnings: false
