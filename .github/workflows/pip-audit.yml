name: pip-audit

on:
  push:
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - "requirements/ci-pip-audit.txt"
      - "pyproject.toml"
      - ".github/workflows/pip-audit.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/pip-audit.yml"
  schedule:
    - cron: "0 7 * * 1" # Weekly (Mon 07:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pip-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies (for accurate audit)
        run: |
          python -m pip install --require-hashes -r requirements/ci-bootstrap-tools.txt
          python -m pip install --require-hashes -r requirements/ci-pip-audit.txt
          python -m pip install --require-hashes -r requirements/runtime-linux-cp312.txt -r requirements/dev-linux-cp312.txt

      - name: Run pip-audit
        run: |
          pip-audit
