name: pip-audit

on:
  push:
    paths:
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/pip-audit.yml"
  pull_request:
    paths:
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/pip-audit.yml"
  schedule:
    - cron: "0 7 * * 1" # Weekly (Mon 07:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pip-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Install dependencies (for accurate audit)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip install -r requirements.txt
          if [ -f requirements-web.txt ]; then python -m pip install -r requirements-web.txt; fi
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run pip-audit
        run: |
          pip-audit
