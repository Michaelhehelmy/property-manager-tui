name: pip-audit

on:
  push:
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - "requirements/ci-pip-audit.txt"
      - "pyproject.toml"
      - ".github/workflows/pip-audit.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/pip-audit.yml"
  schedule:
    - cron: "0 7 * * 1" # Weekly (Mon 07:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pip-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies (for accurate audit)
        run: |
          python -m pip install --require-hashes -r requirements/ci-bootstrap-tools.txt
          python -m pip install --require-hashes -r requirements/ci-pip-audit.txt
          python -m pip install --require-hashes -r requirements/runtime-linux-cp312.txt -r requirements/dev-linux-cp312.txt

      - name: Run pip-audit
        run: |
          pip-audit
