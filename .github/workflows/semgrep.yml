name: Semgrep

on:
  push:
  pull_request:
  schedule:
    - cron: "15 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install "semgrep==1.186.0"

      - name: Run Semgrep (SARIF)
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/default \
            --config p/python \
            --metrics=off \
            --sarif --output semgrep.sarif \
            --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token \
            --exclude-rule python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query \
            --exclude data --exclude models --exclude .git --exclude .pytest_cache \
            .

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep
