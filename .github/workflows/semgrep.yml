name: Semgrep

on:
  push:
  pull_request:
  schedule:
    - cron: "15 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install --require-hashes \
            --hash=sha256:54ebaf79adf4e5855c54d5e4457d8d03f27cc6bf73d79642281790b833d92e4f \
            --hash=sha256:bd0cfe78d0fab4da9a27e591c7dfde118757fba71e483b74bc2007ef695a1108 \
            semgrep==1.186.0

      - name: Run Semgrep (SARIF)
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/default \
            --config p/python \
            --metrics=off \
            --sarif --output semgrep.sarif \
            --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token \
            --exclude-rule python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query \
            --exclude data --exclude models --exclude .git --exclude .pytest_cache \
            .

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep
