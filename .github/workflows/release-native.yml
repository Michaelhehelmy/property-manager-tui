name: Build native binaries (Nuitka)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: property-manager-windows-x64
            shell_ext: .exe
          - os: ubuntu-latest
            artifact_name: property-manager-linux-x64
            shell_ext: ""
          - os: macos-15-intel
            artifact_name: property-manager-macos-x64
            shell_ext: ""
          - os: macos-latest
            artifact_name: property-manager-macos-arm64
            shell_ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-web.txt || true
          pip install nuitka ordered-set zstandard

      - name: Build (Nuitka standalone)
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --enable-plugin=anti-bloat \
            --include-package=app_core \
            --include-package=ui \
            --include-package=uvicorn \
            --include-package=fastapi \
            --include-package=starlette \
            --include-package=anyio \
            --include-package=jinja2 \
            --include-package=itsdangerous \
            --include-package=python_multipart \
            --include-package=multipart \
            --include-package=pydantic \
            --include-package=pydantic_core \
            --include-data-dir=ui/web/templates=ui/web/templates \
            --include-data-dir=ui/web/static=ui/web/static \
            --include-data-files=pyproject.toml=pyproject.toml \
            --output-dir=dist/nuitka \
            launcher.py

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          cd dist/nuitka
          # Nuitka outputs launcher.dist or launcher.exe depending on platform/mode
          if [ -d launcher.dist ]; then
            if [[ "${{ matrix.os }}" == windows-* ]]; then
              7z a "../${{ matrix.artifact_name }}.zip" launcher.dist
            else
              tar -czf "../${{ matrix.artifact_name }}.tar.gz" launcher.dist
            fi
          elif [ -f launcher.exe ]; then
            7z a "../${{ matrix.artifact_name }}.zip" launcher.exe
          else
            echo "Build output not found" >&2; ls -la; exit 1
          fi

      - name: Smoke test packaged binary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, platform, shutil, socket, subprocess, sys, tempfile, time, urllib.request

          artifact = os.environ.get("ARTIFACT_NAME", "")
          root = pathlib.Path("dist").resolve()
          work = root / "_smoke"
          if work.exists():
              shutil.rmtree(work)
          work.mkdir(parents=True, exist_ok=True)

          # Extract packaged artifact
          candidates = list(root.glob(f"{artifact}.*")) or list(root.glob("property-manager-*"))
          if not candidates:
              print("No packaged artifact found in dist", file=sys.stderr)
              sys.exit(1)
          pkg = candidates[0]
          print(f"Smoke test package: {pkg}")
          if pkg.suffix == ".zip":
              shutil.unpack_archive(str(pkg), str(work))
          elif pkg.name.endswith(".tar.gz"):
              shutil.unpack_archive(str(pkg), str(work))
          else:
              shutil.copy2(pkg, work / pkg.name)

          # Locate launcher executable
          exe = None
          if os.name == "nt":
              for cand in [work / "launcher.dist" / "launcher.exe", work / "launcher.exe"]:
                  if cand.exists():
                      exe = cand
                      break
              if exe is None:
                  found = list(work.rglob("launcher.exe"))
                  exe = found[0] if found else None
          else:
              for cand in [work / "launcher.dist" / "launcher", work / "launcher"]:
                  if cand.exists():
                      exe = cand
                      break
              if exe is None:
                  found = [p for p in work.rglob("launcher") if p.is_file()]
                  exe = found[0] if found else None
          if exe is None:
              print("Launcher executable not found", file=sys.stderr)
              for p in work.rglob("*"):
                  print(" -", p)
              sys.exit(1)
          try:
              os.chmod(exe, 0o755)
          except Exception:
              pass

          # Pick a free localhost port
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
              s.bind(("127.0.0.1", 0))
              port = s.getsockname()[1]

          cmd = [str(exe), "--mode", "web", "--host", "127.0.0.1", "--port", str(port), "--no-browser"]
          print("Starting:", cmd)
          proc = subprocess.Popen(cmd, cwd=str(exe.parent), stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          try:
              ok = False
              last_err = None
              for _ in range(90):  # up to ~90s for cold native startup
                  if proc.poll() is not None:
                      out = ""
                      try:
                          out = (proc.stdout.read() or "")[-4000:]
                      except Exception:
                          pass
                      raise RuntimeError(f"Process exited early with code {proc.returncode}. Output:\n{out}")
                  try:
                      with urllib.request.urlopen(f"http://127.0.0.1:{port}/healthz", timeout=2) as resp:
                          body = resp.read().decode("utf-8", "replace")
                          if resp.status == 200 and '"ok"' in body:
                              print("Health check OK:", body[:300])
                              ok = True
                              break
                  except Exception as e:
                      last_err = e
                  time.sleep(1)
              if not ok:
                  raise RuntimeError(f"Health check did not pass: {last_err}")
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=15)
              except Exception:
                  proc.kill()
          PY
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          PM_WEB_SECRET_KEY: ci-smoke-test-secret-key

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -R release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report-failure:
    name: Report failure issue (sanitized, deduplicated)
    needs: [build]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          title="[Native Build] Failure: ${WORKFLOW} on ${REF_NAME}"
          label="ci-failure:auto"
          run_url="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          short_sha="${SHA:0:12}"
          body_file="$(mktemp)"
          {
            echo "Automated native-build failure report (sanitized)."
            echo ""
            echo "- Workflow: ${WORKFLOW}"
            echo "- Event: ${EVENT}"
            echo "- Ref: ${REF_NAME}"
            echo "- Commit: ${short_sha}"
            echo "- Run: [#${RUN_NUMBER} (attempt ${RUN_ATTEMPT})](${run_url})"
            echo ""
            echo "This issue was opened/updated automatically because a native build/smoke-test run failed. Review the run logs in GitHub Actions, fix the cause, and close this issue when resolved. No secrets, environment variables, logs, or runtime data are included."
          } >"$body_file"
          existing="$(gh issue list --repo "$REPO" --state open --label "$label" --search "$title in:title" --json number,title --jq --arg t "$title" '.[] | select(.title==$t) | .number' 2>/dev/null | head -n1 || true)"
          if [ -n "${existing}" ] && [ "${existing}" != "null" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file "$body_file" >/dev/null
            echo "Updated existing issue #${existing}"
          else
            gh label create "$label" --repo "$REPO" --color "B60205" --description "Automated CI failure reports" >/dev/null 2>&1 || true
            gh issue create --repo "$REPO" --title "$title" --label "$label" --body-file "$body_file"
          fi
