name: Build native binaries (Nuitka)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: spms-windows-x64
            platform: windows
          - os: ubuntu-latest
            artifact_name: spms-linux-x64
            platform: linux
          - os: macos-15-intel
            artifact_name: spms-macos-x64
            platform: macos
          - os: macos-latest
            artifact_name: spms-macos-arm64
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements/ci-bootstrap-tools.txt
          if [ "${{ matrix.platform }}" = "linux" ]; then
            python -m pip install --require-hashes -r requirements/runtime-linux-cp312.txt
            python -m pip install --require-hashes -r requirements/nuitka-linux-cp312.txt
          else
            python -m pip install -r requirements.txt
            python -m pip install "nuitka>=2.6.0" "ordered-set>=4.1.0" "zstandard>=0.23.0" "imageio>=2.36.0"
          fi

      - name: Build native app (Nuitka)
        shell: bash
        env:
          PYTHONPATH: src
          BUILD_PLATFORM: ${{ matrix.platform }}
          NUITKA_OUT: dist/nuitka
        run: |
          set -euo pipefail
          rm -rf "$NUITKA_OUT" dist/pkg 2>/dev/null || true
          mkdir -p "$NUITKA_OUT" dist/pkg
          COMMON_ARGS=(
            -m nuitka
            --assume-yes-for-downloads
            --enable-plugin=anti-bloat
            --include-package=app_core
            --include-package=ui
            --include-package=uvicorn
            --include-package=fastapi
            --include-package=starlette
            --include-package=anyio
            --include-package=jinja2
            --include-package=itsdangerous
            --include-package=python_multipart
            --include-package=multipart
            --include-package=pydantic
            --include-package=pydantic_core
            --include-data-dir=ui/web/templates=ui/web/templates
            --include-data-dir=ui/web/static=ui/web/static
            --include-data-files=pyproject.toml=pyproject.toml
            --output-dir="$NUITKA_OUT"
            --output-filename=spms
          )

          case "$BUILD_PLATFORM" in
            windows)
              # Single-file executable (.exe)
              python "${COMMON_ARGS[@]}" --onefile --windows-console-mode=force launcher.py
              ;;
            linux)
              # Single-file executable/binary (can also be wrapped as AppImage later)
              python "${COMMON_ARGS[@]}" --onefile launcher.py
              ;;
            macos)
              # macOS app bundle packaged into .dmg
              python "${COMMON_ARGS[@]}" --standalone --macos-create-app-bundle --macos-app-name=SPMS launcher.py
              ;;
            *)
              echo "Unsupported BUILD_PLATFORM=$BUILD_PLATFORM" >&2
              exit 1
              ;;
          esac

          echo "Build output:"
          find "$NUITKA_OUT" -maxdepth 3 -print

      - name: Package artifact
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "$BUILD_PLATFORM" in
            windows)
              exe=""
              for c in dist/nuitka/spms.exe dist/nuitka/launcher.exe dist/nuitka/spms.dist/spms.exe dist/nuitka/launcher.dist/launcher.exe; do
                [ -f "$c" ] && exe="$c" && break
              done
              if [ -z "$exe" ]; then exe="$(find dist/nuitka -maxdepth 4 -type f -name '*.exe' | head -n1 || true)"; fi
              [ -n "$exe" ] || { echo "Windows executable not found"; find dist/nuitka -maxdepth 4 -print; exit 1; }
              cp "$exe" "dist/${ARTIFACT_NAME}.exe"
              ;;
            linux)
              bin=""
              for c in dist/nuitka/spms.bin dist/nuitka/spms dist/nuitka/launcher.bin dist/nuitka/launcher; do
                [ -f "$c" ] && bin="$c" && break
              done
              if [ -z "$bin" ]; then bin="$(find dist/nuitka -maxdepth 3 -type f \( -name 'spms*' -o -name 'launcher*' \) ! -name '*.py' | head -n1 || true)"; fi
              [ -n "$bin" ] || { echo "Linux binary not found"; find dist/nuitka -maxdepth 4 -print; exit 1; }
              chmod +x "$bin" || true
              cp "$bin" "dist/${ARTIFACT_NAME}"
              chmod +x "dist/${ARTIFACT_NAME}" || true

              # Best-effort AppImage (single-file Linux distribution)
              set +e
              APPIMAGE_OUT="dist/${ARTIFACT_NAME}.AppImage"
              WORKDIR_APP="dist/_appimage"
              rm -rf "$WORKDIR_APP"
              mkdir -p "$WORKDIR_APP/AppDir/usr/bin" "$WORKDIR_APP/AppDir/usr/share/icons/hicolor/256x256/apps" "$WORKDIR_APP/AppDir/usr/share/applications"
              cp "$bin" "$WORKDIR_APP/AppDir/usr/bin/spms"
              chmod +x "$WORKDIR_APP/AppDir/usr/bin/spms"
              if [ -f ui/web/static/icons/icon-512.png ]; then
                cp ui/web/static/icons/icon-512.png "$WORKDIR_APP/AppDir/spms.png"
                cp ui/web/static/icons/icon-512.png "$WORKDIR_APP/AppDir/usr/share/icons/hicolor/256x256/apps/spms.png"
              fi
              {
                printf '%s\n' \
                  '[Desktop Entry]' \
                  'Type=Application' \
                  'Name=SPMS' \
                  'Comment=Super Property Management System' \
                  'Exec=spms' \
                  'Icon=spms' \
                  'Terminal=true' \
                  'Categories=Office;Finance;'
              } > "$WORKDIR_APP/AppDir/spms.desktop"
              cp "$WORKDIR_APP/AppDir/spms.desktop" "$WORKDIR_APP/AppDir/usr/share/applications/spms.desktop"
              # shellcheck disable=SC2016
              {
                printf '%s\n' \
                  '#!/bin/sh' \
                  'HERE="$(dirname "$(readlink -f \\"$0\\")")"' \
                  'exec "$HERE/usr/bin/spms" "$@"'
              } > "$WORKDIR_APP/AppDir/AppRun"
              chmod +x "$WORKDIR_APP/AppDir/AppRun"
              ARCH_APPIMAGE="$(uname -m)"
              case "$ARCH_APPIMAGE" in
                x86_64|amd64) ARCH_APPIMAGE=x86_64 ;;
                aarch64|arm64) ARCH_APPIMAGE=aarch64 ;;
              esac
              APPIMAGE_TOOL=""
              if command -v appimagetool >/dev/null 2>&1; then
                APPIMAGE_TOOL="$(command -v appimagetool)"
              else
                curl -fsSL -o "$WORKDIR_APP/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH_APPIMAGE}.AppImage" \
                  && chmod +x "$WORKDIR_APP/appimagetool" \
                  && APPIMAGE_TOOL="$WORKDIR_APP/appimagetool"
              fi
              if [ -n "$APPIMAGE_TOOL" ]; then
                ARCH="$ARCH_APPIMAGE" "$APPIMAGE_TOOL" "$WORKDIR_APP/AppDir" "$APPIMAGE_OUT" || echo "AppImage packaging failed (binary artifact still available)"
              else
                echo "appimagetool unavailable; skipping AppImage (binary artifact still available)"
              fi
              rm -rf "$WORKDIR_APP"
              set -e
              ;;
            macos)
              app=""
              for c in dist/nuitka/SPMS.app dist/nuitka/spms.app dist/nuitka/launcher.app; do
                [ -d "$c" ] && app="$c" && break
              done
              if [ -z "$app" ]; then app="$(find dist/nuitka -maxdepth 3 -type d -name '*.app' | head -n1 || true)"; fi
              [ -n "$app" ] || { echo "macOS .app bundle not found"; find dist/nuitka -maxdepth 4 -print; exit 1; }
              hdiutil create -volname "SPMS" -srcfolder "$app" -ov -format UDZO "dist/${ARTIFACT_NAME}.dmg"
              ;;
            *)
              echo "Unsupported BUILD_PLATFORM=$BUILD_PLATFORM" >&2
              exit 1
              ;;
          esac

          echo "Packaged artifacts:"
          ls -la dist

      - name: Smoke test packaged artifact
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          PM_WEB_SECRET_KEY: ci-smoke-test-secret-key
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, platform, shutil, socket, subprocess, sys, tempfile, time, urllib.request

          artifact = os.environ["ARTIFACT_NAME"]
          build_platform = os.environ["BUILD_PLATFORM"]
          root = pathlib.Path("dist").resolve()
          work = root / "_smoke"
          if work.exists():
              shutil.rmtree(work)
          work.mkdir(parents=True, exist_ok=True)

          def find_exe():
              candidates = []
              if build_platform == "windows":
                  exe_pkg = root / f"{artifact}.exe"
                  if exe_pkg.exists():
                      dst = work / exe_pkg.name
                      shutil.copy2(exe_pkg, dst)
                      return dst
                  for ext in (".zip", ".tar.gz"):
                      p = root / f"{artifact}{ext}"
                      if p.exists():
                          shutil.unpack_archive(str(p), str(work))
                          break
                  for p in work.rglob("*.exe"):
                      if p.name.lower().startswith(("spms", "launcher")):
                          candidates.append(p)
                  if not candidates:
                      candidates = list(work.rglob("*.exe"))
              elif build_platform == "linux":
                  bin_pkg = root / f"{artifact}"
                  if bin_pkg.exists() and bin_pkg.is_file():
                      dst = work / bin_pkg.name
                      shutil.copy2(bin_pkg, dst)
                      try:
                          os.chmod(dst, 0o755)
                      except Exception:
                          pass
                      return dst
                  # fallback AppImage or archives
                  appimage = root / f"{artifact}.AppImage"
                  if appimage.exists():
                      dst = work / appimage.name
                      shutil.copy2(appimage, dst)
                      try:
                          os.chmod(dst, 0o755)
                      except Exception:
                          pass
                      return dst
                  for ext in (".tar.gz", ".zip"):
                      p = root / f"{artifact}{ext}"
                      if p.exists():
                          shutil.unpack_archive(str(p), str(work))
                          break
                  for name in ("spms", "launcher", "spms.bin", "launcher.bin", artifact):
                      for p in work.rglob(name):
                          if p.is_file():
                              candidates.append(p)
                  if not candidates:
                      candidates = [p for p in work.rglob("*") if p.is_file() and os.access(p, os.X_OK) and p.suffix not in (".png", ".desktop", ".md", ".txt", ".json")]
              elif build_platform == "macos":
                  dmg = root / f"{artifact}.dmg"
                  if not dmg.exists():
                      # fallback archive
                      for ext in (".tar.gz", ".zip"):
                          p = root / f"{artifact}{ext}"
                          if p.exists():
                              shutil.unpack_archive(str(p), str(work))
                              break
                  else:
                      mount = work / "mnt"
                      mount.mkdir(parents=True, exist_ok=True)
                      subprocess.run(["hdiutil", "attach", str(dmg), "-nobrowse", "-mountpoint", str(mount)], check=True)
                      try:
                          apps = list(mount.glob("*.app"))
                          if not apps:
                              apps = list(mount.rglob("*.app"))
                          if not apps:
                              raise RuntimeError(f"No .app found in mounted dmg: {dmg}")
                          # copy app bundle out so we can detach before running
                          app_dst = work / apps[0].name
                          shutil.copytree(apps[0], app_dst, symlinks=True)
                      finally:
                          subprocess.run(["hdiutil", "detach", str(mount), "-force"], check=False)
                      # find executable inside .app bundle
                      macos_dir = app_dst / "Contents" / "MacOS"
                      if macos_dir.exists():
                          exes = [p for p in macos_dir.iterdir() if p.is_file()]
                          if exes:
                              return exes[0]
                      candidates = [p for p in app_dst.rglob("*") if p.is_file() and os.access(p, os.X_OK)]
              else:
                  raise RuntimeError(f"Unknown platform: {build_platform}")
              if not candidates:
                  print("No executable candidate found. Work tree:", file=sys.stderr)
                  for p in work.rglob("*"):
                      print(" -", p, file=sys.stderr)
                  raise RuntimeError("Executable not found")
              # prefer likely names
              candidates.sort(key=lambda p: (0 if p.name in ("spms","spms.exe","launcher","launcher.exe","spms.bin","launcher.bin",artifact) else 1, len(str(p))))
              return candidates[0]

          exe = find_exe()
          try:
              os.chmod(exe, 0o755)
          except Exception:
              pass
          print(f"Smoke test executable: {exe}")

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
              s.bind(("127.0.0.1", 0))
              port = s.getsockname()[1]

          cmd = [str(exe), "--web", "--host", "127.0.0.1", "--port", str(port), "--no-browser"]
          print("Starting:", cmd)
          proc = subprocess.Popen(cmd, cwd=str(exe.parent), stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          try:
              ok = False
              last_err = None
              for _ in range(120):  # onefile may need longer cold start/extraction
                  if proc.poll() is not None:
                      out = ""
                      try:
                          out = (proc.stdout.read() or "")[-4000:]
                      except Exception:
                          pass
                      raise RuntimeError(f"Process exited early with code {proc.returncode}. Output:\n{out}")
                  try:
                      with urllib.request.urlopen(f"http://127.0.0.1:{port}/healthz", timeout=2) as resp:
                          body = resp.read().decode("utf-8", "replace")
                          if resp.status == 200 and '"ok"' in body:
                              print("Health check OK:", body[:300])
                              ok = True
                              break
                  except Exception as e:
                      last_err = e
                  time.sleep(1)
              if not ok:
                  raise RuntimeError(f"Health check did not pass: {last_err}")
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=20)
              except Exception:
                  proc.kill()
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -R release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report-failure:
    name: Report failure issue (sanitized, deduplicated)
    needs: [build]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          title="[Native Build] Failure: ${WORKFLOW} on ${REF_NAME}"
          label="ci-failure:auto"
          run_url="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          short_sha="${SHA:0:12}"
          body_file="$(mktemp)"
          {
            echo "Automated native-build failure report (sanitized)."
            echo ""
            echo "- Workflow: ${WORKFLOW}"
            echo "- Event: ${EVENT}"
            echo "- Ref: ${REF_NAME}"
            echo "- Commit: ${short_sha}"
            echo "- Run: [#${RUN_NUMBER} (attempt ${RUN_ATTEMPT})](${run_url})"
            echo ""
            echo "This issue was opened/updated automatically because a native build/smoke-test run failed. Review the run logs in GitHub Actions, fix the cause, and close this issue when resolved. No secrets, environment variables, logs, or runtime data are included."
          } >"$body_file"
          # shellcheck disable=SC2016
          existing="$(gh issue list --repo "$REPO" --state open --label "$label" --search "$title in:title" --json number,title --jq --arg t "$title" '.[] | select(.title==$t) | .number' 2>/dev/null | head -n1 || true)"
          if [ -n "${existing}" ] && [ "${existing}" != "null" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file "$body_file" >/dev/null
            echo "Updated existing issue #${existing}"
          else
            gh label create "$label" --repo "$REPO" --color "B60205" --description "Automated CI failure reports" >/dev/null 2>&1 || true
            gh issue create --repo "$REPO" --title "$title" --label "$label" --body-file "$body_file"
          fi
